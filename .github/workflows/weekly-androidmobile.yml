name: Mobile Automation

on:
  push:
    branches: [ main ]
  schedule:
    - cron: "*/5 * * * *"   # ทุก 5 นาที

jobs:
  android-test:
    runs-on: ubuntu-latest   # 🔥 เปลี่ยนจาก macos เป็น ubuntu

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install -r requirement
          npm install -g appium

      - name: Run Android Emulator + Test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64        # 🔥 Linux ใช้ x86_64
          profile: pixel
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb wait-for-device
            until [[ "$(adb shell getprop sys.boot_completed | tr -d '\r')" == "1" ]]; do
              sleep 5
            done

            echo "Starting Appium..."
            appium --base-path /wd/hub > appium.log 2>&1 &
            sleep 20

            echo "Running Robot..."
            robot -d results Testcase/ || true

      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: robot-results
          path: results/

      - name: Send Webhook
        run: python send_webhook.py
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          TEST_STATUS: ${{ job.status }}