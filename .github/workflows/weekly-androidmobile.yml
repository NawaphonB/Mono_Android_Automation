name: Android Robot Automation

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  android-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Appium
        run: |
          npm install -g appium@2.11.3
          appium driver install uiautomator2@2.34.0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install robotframework
          pip install requests

      - name: Run Emulator + Test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: Nexus 5
          ram-size: 2048
          heap-size: 512
          disk-size: 2048M
          emulator-options: -no-window -no-snapshot -noaudio -gpu swiftshader_indirect -no-boot-anim
          disable-animations: true
          script: |
            echo "Restarting adb..."
            adb kill-server
            adb start-server

            echo "Waiting for boot..."
            adb wait-for-device

            boot_completed=""
            until [[ "$boot_completed" == "1" ]]; do
              boot_completed=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
              sleep 5
            done

            echo "Emulator fully booted."

            echo "Starting Appium..."
            appium --base-path /wd/hub > appium.log 2>&1 &
            sleep 20

            echo "Running Robot..."
            robot -d results Testcase/ || true

      - name: Send Webhook
        if: always()
        run: python send_webhook.py
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}

      - name: Upload Robot Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-report
          path: results/