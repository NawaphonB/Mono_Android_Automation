name: Android Robot CI

on:
  push:
    branches: [ phath-android ]
  schedule:
    # - cron: "*/5 * * * *"
    - cron: "0 2 * * 1"
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-kvm
          sudo chmod 666 /dev/kvm || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          pip install -r requirements.txt
          pip install requests 

      # 🔥 อัปเดต Step นี้: บังคับ Path การติดตั้ง Appium Driver ให้ชัดเจน
      - name: Install Appium
        run: |
          echo "Installing Appium 2.x..."
          npm install -g appium
          
          echo "Setting APPIUM_HOME to a local directory..."
          export APPIUM_HOME=$HOME/.appium
          mkdir -p $APPIUM_HOME
          
          echo "Installing UiAutomator2 driver..."
          appium driver install uiautomator2
          
          echo "Listing installed drivers to verify:"
          appium driver list --installed
                                          
      - name: Download APK
        run: |
          wget -q -O monomax.apk "https://drive.google.com/drive/folders/1jUsx7gc4RKQahiIncV3r24chRSyHxmHC?usp=drive_link"

      - name: Run Emulator + Robot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel
          emulator-options: -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            echo "Emulator booted successfully by Action."
            adb devices
            
            echo "Starting Appium in background..."
            # 🔥 อัปเดต: บอก Appium ว่า Driver ที่ลงไว้อยู่ตรงไหน
            export APPIUM_HOME=$HOME/.appium
            nohup appium --base-path /wd/hub > appium.log 2>&1 &
            
            echo "Waiting for Appium to start..."
            sleep 15
            
            echo "Check Appium running..."
            ps -ef | grep appium || true
            
            echo "Running Robot Framework..."
            robot -d results Testcase/

      - name: Send Alert to Webhook
        if: always() 
        run: python send_webhook.py 
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}

      - name: Upload Results
        uses: actions/upload-artifact@v4
        if: always() 
        with:
          name: robot-results
          path: results/