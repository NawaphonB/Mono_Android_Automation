name: Android Robot CI

on:
  push:
    branches: [ main ]
  schedule:
    # - cron: "*/5 * * * *"
    - "0 2 * * 1"
  workflow_dispatch:

jobs:
  android:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-kvm
          sudo chmod 666 /dev/kvm || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          pip install -r requirements.txt
          # ติดตั้ง requests เผื่อไว้สำหรับ script ส่ง webhook
          pip install requests 

      - name: Install Appium
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Run Emulator + Robot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel
          emulator-options: -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            echo "Emulator booted successfully by Action."
            adb devices
            
            echo "Starting Appium in background..."
            nohup appium --base-path /wd/hub > appium.log 2>&1 &
            
            echo "Waiting for Appium to start..."
            sleep 15
            
            echo "Check Appium running..."
            ps -ef | grep appium || true
            
            echo "Running Robot Framework..."
            # รัน Robot Framework (ถ้ามีเทสพัง บรรทัดนี้จะส่ง Exit Code Error แต่เราจัดการด้วย if: always() ใน step ถัดไป)
            robot -d results Testcase/

      - name: Send Alert to Webhook
        if: always() 
        run: python send_webhook.py 
        env:

          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}

      - name: Upload Results
        uses: actions/upload-artifact@v4
        if: always() 
        with:
          name: robot-results
          path: results/