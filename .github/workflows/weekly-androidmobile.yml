name: Android Robot CI

on:
  push:
    branches: [ phath-android ]
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-kvm
          sudo chmod 666 /dev/kvm || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          pip install -r requirements.txt
          pip install requests 
          pip install gdown 

      - name: Install Appium and Driver
        run: |
          echo "Initializing a local Node project..."
          npm init -y
          
          echo "Installing Appium locally..."
          npm install appium
          
          echo "Installing UiAutomator2 driver..."
          npx appium driver install uiautomator2
          
          echo "Listing installed drivers to verify:"
          npx appium driver list --installed

      - name: Download APK
        run: |
          gdown 1c_kb9iS8OsXII8EX-hy24W74o90O0TSj -O monomax.apk

      - name: Run Emulator + Robot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel
          emulator-options: -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            echo "Emulator booted successfully by Action."
            adb devices
            
            echo "Starting Appium in background..."
            nohup npx appium --base-path /wd/hub > appium.log 2>&1 &
            
            echo "Waiting for Appium to start..."
            sleep 15
            
            echo "Check Appium running..."
            ps -ef | grep appium || true
            
            echo "Running Robot Framework..."
            robot -d results -i done Testcase/

      - name: Send Alert to Webhook
        if: always() 
        run: python send_webhook.py 
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}

      - name: Upload Results
        uses: actions/upload-artifact@v4
        if: always() 
        with:
          name: robot-results
          path: results/