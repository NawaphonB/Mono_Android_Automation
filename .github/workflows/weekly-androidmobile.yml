name: Android Robot CI

on:

  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:   # ✅ กด Run เองได้

jobs:
  android:
    runs-on: ubuntu-latest   # 🔥 ต้องเป็น ubuntu เท่านั้น

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 🔥 เปิด KVM สำหรับ Emulator
      - name: Enable KVM
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-kvm
          sudo chmod 666 /dev/kvm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Requirements
        run: |
          pip install -r requirement

      - name: Install Appium
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Run Android Emulator + Robot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel
          emulator-options: -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            adb wait-for-device

            echo "Waiting for full boot..."
            until [[ "$(adb shell getprop sys.boot_completed | tr -d '\r')" == "1" ]]; do
              sleep 5
            done

            echo "Emulator Booted!"
            adb devices

            echo "Starting Appium..."
            appium --base-path /wd/hub > appium.log 2>&1 &
            sleep 30

            echo "Running Robot..."
            robot -d results Testcase/ || true

      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: robot-results
          path: results/