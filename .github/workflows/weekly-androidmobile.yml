name: Android Robot Automation

on:
  schedule:
    - cron: '*/5 * * * *'   # ทุก 5 นาที (UTC)
  workflow_dispatch:

jobs:
  android-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # -------------------------
      # Checkout
      # -------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------
      # Setup Node
      # -------------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # -------------------------
      # Install Appium 2 (Stable Pair)
      # -------------------------
      - name: Install Appium (Stable)
        run: |
          npm install -g appium@2.11.3
          appium driver install uiautomator2@2.34.0
          appium -v

      # -------------------------
      # Setup Python
      # -------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install robotframework
          pip install requests

      # -------------------------
      # Run Emulator + Appium + Robot
      # -------------------------
      - name: Run Android Emulator + Test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb wait-for-device

            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0

            echo "Starting Appium..."
            appium --base-path /wd/hub > appium.log 2>&1 &
            sleep 20

            echo "Running Robot Tests..."
            robot -d results Testcase/ || true

      # -------------------------
      # Send Webhook (อ่าน output.xml)
      # -------------------------
      - name: Send Webhook
        if: always()
        run: python send_webhook.py
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}

      # -------------------------
      # Upload Robot Report
      # -------------------------
      - name: Upload Robot Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-report
          path: results/