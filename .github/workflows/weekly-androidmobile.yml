name: Android Emulator Tests

on:
  push:
    branches: [ "main" ] # หรือระบุ Branch ที่ต้องการ

jobs:
  test:
    # แนะนำให้ใช้ macos-latest เพราะรองรับ Hardware Acceleration ทำให้ Emulator ลื่นกว่า
    runs-on: macos-latest 

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17' # เปลี่ยนตามเวอร์ชัน Java ที่โปรเจกต์คุณใช้
        distribution: 'temurin'

    - name: Run Android Emulator and Tests
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 29
        target: default
        arch: x86_64
        profile: Nexus 6
        # ตัว Action จะรอจนกว่าเครื่องจะบูทเสร็จและปิด Animation ให้เอง
        # ดังนั้นใน script เราเขียนแค่คำสั่งรันเทสต์ได้เลย
        script: |
          echo "Emulator is ready! Running tests..."
          ./gradlew connectedCheck